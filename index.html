<!DOCTYPE html>
<html>
<head>
    <title>My First Web Page</title>
</head>
<body style="background-color: white; color: black; font-family: monospace;">

    <h3>My Arcade Game</h3>
    
    <div id="output" style="background-color: #eee; border: 1px solid black; width: 600px; height: 350px; padding: 10px; overflow-y: scroll; white-space: pre-wrap;"></div>
    
    <br>

  
    <input type="text" id="userInput" placeholder="type here..." style="width: 500px; padding: 5px;" autofocus>
    <button onclick="handleEnter()" style="padding: 5px 15px;">Enter</button>

    <script>
        const outputBox = document.getElementById('output');
        const inputField = document.getElementById('userInput');
        let waitingForInput = null;

        function printLog(text = '') {
            outputBox.textContent += text + '\n';
            outputBox.scrollTop = outputBox.scrollHeight;
        }

        function askInput(promptText) {
            printLog(promptText);
            return new Promise(resolve => {
                waitingForInput = resolve;
            });
        }

        function handleEnter() {
            if (waitingForInput) {
                let val = inputField.value;
                inputField.value = '';
                printLog('> ' + val);
                let resolveFn = waitingForInput;
                waitingForInput = null;
                resolveFn(val);
            }
        }

        inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleEnter();
        });

      
        async function number_guessing_game() {
            let secretNum = Math.floor(Math.random() * 100) + 1;
            let tries = 0;
            
            printLog("Welcome to my number guessing game and rock paper scissor, first we will play number guessing game");
            printLog("I have selected a random number between 1 and 100");

            async function makeGuess() {
                let guessStr = await askInput("Enter your number guess: ");
                let guess = parseInt(guessStr);
                tries++;
                
                if (isNaN(guess)) {
                    printLog("bruh, type an actual number lol");
                    return makeGuess(); 
                }
                
                if (guess < secretNum) {
                    printLog("you are tooooooooooooo low");
                    return makeGuess();
                } else if (guess > secretNum) {
                    printLog("tooooooooo high! Try again :)");
                    return makeGuess();
                } else {
                    printLog(`Congratulations! You have guessed the number ${secretNum} correctly!`);
                    printLog(`It took you ${tries} attempts.`);
                }
            }

            await makeGuess();
        }

      
        function getBotChoice() {
            let babayaga = Math.floor(Math.random() * 3) + 1;
            if (babayaga === 1) return "Rock";
            if (babayaga === 2) return "Paper";
            if (babayaga === 3) return "scissors";
        }

        async function play_game() {
            printLog("WELCOME TO ROCK, PAPER, SCISSORS!");
            printLog("Rules: ROCK beats SCISSORS, SCISSORS beats PAPER, PAPER beats ROCK.");
            printLog("Choose:");
            printLog("1: Rock");
            printLog("2: Paper");
            printLog("3: scissors");
            
            let choiceStr = await askInput("Enter your choice (1-3) : ");
            let choiceNum = parseInt(choiceStr);
            let myChoiceName = "";
            
            if (choiceNum === 1) myChoiceName = "Rock";
            else if (choiceNum === 2) myChoiceName = "Paper";
            else if (choiceNum === 3) myChoiceName = "scissors";
            else {
                printLog("Invalid Choice! Please choose 1, 2, or 3.");
                return;
            }
            
            let pcChoice = getBotChoice();
            printLog(`Computer chose: ${pcChoice}`);
            
            if (myChoiceName === pcChoice) {
                printLog("It is a tie hahaha");
            } else if (
                (myChoiceName === "Rock" && pcChoice === "scissors") ||
                (myChoiceName === "Paper" && pcChoice === "Rock") ||
                (myChoiceName === "scissors" && pcChoice === "Paper")
            ) {
                printLog("YOU WIN");
            } else {
                printLog("You Lose! hahaha");
            }
        }

       
        async function ask_question(q, o1, o2, o3, o4, correctIdx) {
            printLog(q);
            printLog(`1. ${o1}`);
            printLog(`2. ${o2}`);
            printLog(`3. ${o3}`);
            printLog(`4. ${o4}`);
            
            let ans = await askInput("choose the correct option (1-4): ");
            let allOpts = [o1, o2, o3, o4];
            
            if (ans.trim() !== "" && !isNaN(ans) && parseInt(ans) - 1 === correctIdx) {
                printLog("correct! yahooooo!!\n");
                return true;
            } else {
                let rightOpt = allOpts[correctIdx];
                printLog(`Wrong! The correct answer was: ${rightOpt}\n`);
                return false;
            }
        }

        async function quiz_game() {
            printLog("welcome to the quiz game!");
            let totalScore = 0;
            
            if (await ask_question("Who is the founder of Hack Club?", "Zach Latta", "Elon Musk", "Jeff Bezos", "Satya Nadella", 0)) {
                totalScore++;
            }
            if (await ask_question("When was hack club founded?", "2014", "2020", "2007", "1990", 0)) {
                totalScore++;
            }
            if (await ask_question("When was the first computer built?", "2014", "2020", "1822", "1990", 2)) {
                totalScore++;
            }
            if (await ask_question("When was the first program written?", "1770", "1843", "1907", "1990", 1)) {
                totalScore++;
            }
            
            printLog(`Game over! your final score is: ${totalScore} out of 4`);
        }

      
        async function main() {
            await number_guessing_game();
            printLog("\n" + "=".repeat(40) + "\n");
            await play_game();
            printLog("\n" + "=".repeat(40) + "\n");
            await quiz_game();
        }

        main();
    </script>
</body>
</html>
